name: tandem
description: Makes an existing Flutter screen agent-aware over AG-UI. The agent and the user edit the same state, and important actions wait for the user's approval.
version: 0.0.1
repository: https://github.com/leancodepl/tandem
issue_tracker: https://github.com/leancodepl/tandem/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

workspace:
  - packages/tandem_bloc

dependencies:
  http: ^1.6.0
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0
