name: tandem_workspace
publish_to: none

environment:
  sdk: ^3.13.0

# The generator resolves separately because its test dependency conflicts with
# Flutter's test_api pin.
workspace:
  - packages/tandem
  - example
  - fixtures/kit_ds
  - fixtures/greenhouse_app
  - showcase/app
  - showcase/packages/waypoint_design_system
  - showcase/packages/waypoint_scripted_agent
  - showcase/packages/waypoint_travel

dev_dependencies:
  leancode_lint: ">=27.0.0 <29.0.0"
