name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventions:
    name: Check commits and description

    # Dependabot writes its own titles, bodies and commit messages.
    if: github.event.pull_request.user.login != 'dependabot[bot]'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3

      - name: Check commits
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}

      - name: Check title
        run: echo "$TITLE" | npx commitlint --verbose
        env:
          TITLE: ${{ github.event.pull_request.title }}

      - name: Check description sections
        run: |
          for section in What Why How; do
            if ! grep -Eq "^## $section[[:space:]]*$" <<< "$BODY"; then
              echo "::error title=Description::Missing the $section section of .github/pull_request_template.md"
              exit 1
            fi
          done
        env:
          BODY: ${{ github.event.pull_request.body }}
