name: pana

on:
  push:
    branches: [main]
    paths: [packages/**, .github/workflows/pana.yml]
  pull_request:
    paths: [packages/**, .github/workflows/pana.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pana:
    name: Score ${{ matrix.package }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    strategy:
      fail-fast: false
      matrix:
        package: [tandem, tandem_generator]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # pana resolves the other packages from pub.dev, so only the files of
      # this package change its score. A failed diff counts as a change.
      - name: Check whether ${{ matrix.package }} changed
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PACKAGE: ${{ matrix.package }}
        run: |
          if git diff --quiet "$BASE...$HEAD" -- "packages/$PACKAGE" .github/workflows/pana.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=pana ($PACKAGE)::Not scored, the package did not change"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Score ${{ matrix.package }} with pana
        if: steps.changed.outputs.changed == 'true'
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        with:
          path: packages/${{ matrix.package }}
