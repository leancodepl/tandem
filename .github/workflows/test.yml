name: test

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

jobs:
  test:
    name: Test and analyze

    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      # `flutter analyze` skips analyzer plugins, so the leancode_lint rules run
      # only under `dart analyze`.
      - name: Run analyzer
        run: dart analyze

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run tests
        run: flutter test

      - name: Dry run pub publish
        uses: leancodepl/mobile-tools/.github/actions/pub-release@0bfd6b4b187d1b99fb2cd5e0e6ea4d626837005f # pub-release-v1
        with:
          dry-run: true

      - name: Score package with pana
        uses: leancodepl/mobile-tools/.github/actions/pana-score@e9f138c252f8e2254c88273367958fcc6bb39cad # pana-score-v1.3
        continue-on-error: true
