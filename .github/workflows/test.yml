name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes

    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      dart: ${{ steps.changes.outputs.dart }}
      agent: ${{ steps.changes.outputs.agent }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Package docs count as Dart, because the dry run of pub publish reads
      # them. So do the README and doc/examples.md, which a test of the
      # example reads.
      - name: Detect changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE...$HEAD")"
          dart=false
          agent=false
          while IFS= read -r file; do
            case "$file" in
              packages/*) dart=true ;;
              example/agent/*) agent=true ;;
              .github/workflows/test.yml) dart=true; agent=true ;;
              README.md | doc/examples.md) dart=true ;;
              .github/* | doc/* | *.md | .commitlintrc.yml) ;;
              *) dart=true ;;
            esac
          done <<< "$changed"
          echo "dart=$dart" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "Dart: $dart, agent: $agent"

  analyze:
    name: Analyze

    needs: changes
    if: needs.changes.outputs.dart == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      # packages/tandem_generator is not a workspace member (see doc/design.md),
      # so the pub get above does not cover it.
      - name: Download pub dependencies of tandem_generator
        run: dart pub get
        working-directory: packages/tandem_generator

      # `flutter analyze` skips analyzer plugins, so the leancode_lint rules run
      # only under `dart analyze`. Infos fail too: leancode_lint keeps the
      # deprecation lints at info.
      - name: Run analyzer
        run: dart analyze --fatal-infos

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  test:
    name: Test

    needs: changes
    if: needs.changes.outputs.dart == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      - name: Download pub dependencies of tandem_generator
        run: dart pub get
        working-directory: packages/tandem_generator

      - name: Test tandem
        run: flutter test
        working-directory: packages/tandem

      - name: Test tandem_generator
        run: dart test
        working-directory: packages/tandem_generator

      - name: Test example
        run: flutter test
        working-directory: example

  codegen:
    name: Check the generated code

    needs: changes
    if: needs.changes.outputs.dart == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Download pub dependencies
        run: flutter pub get

      # An outdated .g.dart is not always caught at runtime, so the generated
      # code of the example must be what the generator writes now.
      - name: Generate the example code
        run: dart run build_runner build
        working-directory: example

      - name: Generate the Swift bridge API
        run: dart run pigeon --input pigeons/apple_api.dart && dart format lib test
        working-directory: packages/tandem

      - name: Check the generated code is up to date
        run: git diff --exit-code

  publish:
    name: Dry run pub publish

    needs: changes
    if: needs.changes.outputs.dart == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Dry run pub publish of tandem
        uses: leancodepl/mobile-tools/.github/actions/pub-release@0bfd6b4b187d1b99fb2cd5e0e6ea4d626837005f # pub-release-v1
        with:
          path: packages/tandem
          dry-run: true

      - name: Dry run pub publish of tandem_generator
        uses: leancodepl/mobile-tools/.github/actions/pub-release@0bfd6b4b187d1b99fb2cd5e0e6ea4d626837005f # pub-release-v1
        with:
          path: packages/tandem_generator
          dry-run: true

  # A macOS runner costs ten times a Linux one, so this runs on main only.
  apple:
    name: Apple native contracts and builds
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.dart == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true
      - name: Native contracts without model inference
        run: bash tool/check_apple.sh
      - name: Download pub dependencies
        run: flutter pub get
      - name: Build macOS plugin and example
        run: flutter build macos --debug -t lib/recipes/on_device/apple.dart
        working-directory: example
      - name: Build iOS plugin and example without signing
        run: flutter build ios --debug --no-codesign -t lib/recipes/on_device/apple.dart
        working-directory: example

  # The ruleset requires this check. A job skipped by its `if` counts as passed.
  result:
    name: Test and analyze

    needs: [changes, analyze, test, codegen, publish, apple]
    if: ${{ !cancelled() }}

    runs-on: ubuntu-latest

    permissions: {}

    steps:
      - name: Check the results of the jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  agent:
    name: Test and lint the example agent

    needs: changes
    if: needs.changes.outputs.agent == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: example/agent

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The uv that wrote uv.lock, so that a new uv release does not change
      # what `uv sync --locked` does.
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
          python-version: '3.14'
          working-directory: example/agent

      - name: Download Python dependencies
        run: uv sync --locked

      - name: Run ruff
        run: uv run ruff check

      - name: Check Python formatting
        run: uv run ruff format --check

      # The tests play the demo with the scripted model: no API key, no network.
      - name: Test the agent
        run: uv run pytest
