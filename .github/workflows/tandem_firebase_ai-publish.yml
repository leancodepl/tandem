name: tandem_firebase_ai publish

on:
  push:
    tags: ['tandem_firebase_ai-v*']

jobs:
  publish:
    name: Publish to pub.dev

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(awk '$1 == "version:" { print $2; exit }' packages/tandem_firebase_ai/pubspec.yaml)"
          if [ "$RELEASE_TAG" != "tandem_firebase_ai-v$version" ]; then
            echo "::error::The release tag must match tandem_firebase_ai's pubspec version."
            exit 1
          fi

      # The first version needs manual publication: https://dart.dev/tools/pub/automated-publishing
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.x
          cache: true

      - name: Publish and release
        uses: leancodepl/mobile-tools/.github/actions/pub-release@0bfd6b4b187d1b99fb2cd5e0e6ea4d626837005f # pub-release-v1
        with:
          path: packages/tandem_firebase_ai
