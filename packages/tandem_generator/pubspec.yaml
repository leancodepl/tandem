name: tandem_generator
description: "Generates the code behind a Tandem agent list: the names, doc comments and JSON Schemas of what a class lets the agent see and call."
version: 0.2.0
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem_generator
issue_tracker: https://github.com/leancodepl/tandem/issues
topics:
  - ai
  - agent
  - codegen
  - build-runner
  - json-schema

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ^14.0.0
  build: ">=4.0.0 <6.0.0"
  build_config: ^1.3.2
  source_gen: ^4.3.0

dev_dependencies:
  build_test: ^3.5.0
  leancode_lint: ">=27.0.0 <29.0.0"
  test: ^1.31.0
