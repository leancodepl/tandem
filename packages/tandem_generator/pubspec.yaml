name: tandem_generator
description: "Generates the code behind Tandem with build_runner. It turns the data and methods a class lists for an AI agent into JSON Schemas and tools, and your widgets into A2UI components."
version: 0.3.1
homepage: https://tandem.leancode.co
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem_generator
issue_tracker: https://github.com/leancodepl/tandem/issues
topics:
  - agent
  - genui
  - codegen
  - a2ui
  - json-schema

environment:
  sdk: ^3.13.0

dependencies:
  analyzer: ">=13.3.0 <15.0.0"
  build: ">=4.0.0 <6.0.0"
  build_config: ^1.3.2
  source_gen: ">=4.2.4 <5.0.0"

dev_dependencies:
  build_test: ^3.5.0
  leancode_lint: ">=27.0.0 <29.0.0"
  test: ^1.31.0
