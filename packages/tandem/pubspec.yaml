name: tandem
description: Makes an existing Flutter screen agent-aware over AG-UI. The agent sees what its state class lists and calls its methods; important actions wait for approval.
version: 0.2.3
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem
issue_tracker: https://github.com/leancodepl/tandem/issues
topics:
  - ai
  - agent
  - llm
  - ag-ui
  - generative-ai

# The plugin registers only on iOS and macOS. Remote connections work on every
# platform, and this list keeps them all on pub.dev.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  json_annotation: ^4.9.0
  meta: ^1.19.0
  rfc_6902: ^0.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TandemPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TandemPlugin
        sharedDarwinSource: true
