name: tandem
description: Add an AI agent to a Flutter screen with AG-UI. Choose which data and methods to expose and which calls need approval. Render A2UI components with your widgets.
version: 0.3.0
homepage: https://tandem.leancode.co
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem
issue_tracker: https://github.com/leancodepl/tandem/issues
topics:
  - ai
  - agent
  - ag-ui
  - a2ui
  - generative-ai

# The plugin registers only on iOS and macOS. Remote connections work on every
# platform, and this list keeps them all on pub.dev.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  json_annotation: ^4.9.0
  meta: ^1.19.0
  rfc_6902: ^0.3.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^29.0.11
  stream_channel: ^2.1.4

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TandemPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TandemPlugin
        sharedDarwinSource: true
