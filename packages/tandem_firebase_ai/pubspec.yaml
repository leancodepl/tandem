name: tandem_firebase_ai
description: Add an AI agent to Flutter screens with Tandem and Firebase AI Logic, without an agent backend. Gemini reads what a screen lists and proposes calls of its methods.
version: 0.2.0
homepage: https://tandem.leancode.co
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem_firebase_ai
issue_tracker: https://github.com/leancodepl/tandem/issues
topics:
  - firebase
  - generative-ai
  - agent
  - genui
  - function-calling
platforms:
  android:
  ios:
  web:

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  firebase_ai: ^5.2.0
  http: ^1.6.0
  tandem: ^0.4.0
  uuid: ^4.6.0

dev_dependencies:
  firebase_app_check: ^0.5.2
  firebase_core: ^5.2.0
  firebase_core_platform_interface: ^8.2.0
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
