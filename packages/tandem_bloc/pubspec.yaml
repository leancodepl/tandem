name: tandem_bloc
description: Connects Tandem to bloc. A TandemScope makes the screen below it agent-aware and drops pending approvals when what the agent sees in the Cubit changes.
version: 0.1.0
repository: https://github.com/leancodepl/tandem/tree/main/packages/tandem_bloc
issue_tracker: https://github.com/leancodepl/tandem/issues

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  tandem: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
