# A pull request is reviewed with this folder as main has it, so a change here applies after the merge.

name = "leancodepl/tandem"
about = "a public Flutter package whose code is written by AI agents and reviewed by one maintainer"

rules = ["AGENTS.md", "doc/code-quality.md"]
lenses = ["raw-types", "structure", "responsibility", "noise", "reuse", "description"]

ignore = ["*.g.dart", "*.freezed.dart", "*.lock", "*.png", "*.jpg", "*.svg", "*.ttf"]

read_also = ["~/.pub-cache/hosted/pub.dev"]

priority = "The maintainer treats these as defects to fix, not advice, in this order: a value with identity or meaning held in a raw type; a function or file that is hard to read; responsibility in the wrong place or logic that a dependency already provides; then comments, tests and docs that add nothing. Within a kind, a problem in the package's public API or core comes before one in a private helper, the example or tests."

[harness]
name = "codex"
auth = "api"
model = "gpt-6.2-sol"
effort = "high"
