include: package:leancode_lint/analysis_options.yaml

plugins:
  leancode_lint: ^27.0.0

linter:
  rules:
    always_put_control_body_on_new_line: false

analyzer:
  exclude:
    - build/**
    - "**/build/**"
    # Pigeon reads its inputs with an older Dart syntax, and nobody edits
    # what it writes.
    - "**/pigeons/**"
    - packages/tandem/test/protocol/apple_api_test.g.dart
