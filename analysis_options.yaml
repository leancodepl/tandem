include: package:leancode_lint/analysis_options.yaml

plugins:
  leancode_lint: ^28.0.0

linter:
  rules:
    always_put_control_body_on_new_line: false

analyzer:
  exclude:
    - build/**
    - "**/build/**"
    # Pigeon inputs use its supported syntax; its generated code is not edited.
    - "**/pigeons/**"
    - packages/tandem/test/protocol/apple_api_test.g.dart
