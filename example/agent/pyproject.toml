[project]
name = "order-agent"
version = "0.1.0"
description = "The Google ADK agent of the Tandem demo: a B2B order from an e-mail."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ag-ui-adk==0.9.0",
    "fastapi",
    "google-adk>=2.12,<2.13",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
order-agent = "order_agent.server:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore::DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
