name: example
description: "The example app of Tandem: an order desk on bloc, and screens to copy on bloc, Riverpod and provider."
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  provider: ^6.1.5
  tandem: ^0.2.2

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  tandem_generator:
    path: ../packages/tandem_generator

flutter:
  uses-material-design: true
