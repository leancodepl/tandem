name: example
description: "The examples of Tandem: an order desk on bloc with a scripted agent, and invoices on Apple's on-device model."
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  json_annotation: ^4.9.0
  provider: ^6.1.5
  tandem: ^0.2.3

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  tandem_generator:
    path: ../packages/tandem_generator

flutter:
  uses-material-design: true
