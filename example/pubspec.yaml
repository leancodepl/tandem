name: example
description: "The example of Tandem: an order desk on bloc with a scripted agent."
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  json_annotation: ^4.9.0
  tandem: ^0.4.0
  tandem_firebase_ai: ^0.2.0

dev_dependencies:
  build_runner: ^2.16.0
  flutter_test:
    sdk: flutter
  tandem_generator:
    path: ../packages/tandem_generator

flutter:
  uses-material-design: true
