[project]
name = "order-agent-adk"
version = "0.1.0"
description = "The order desk agent on Google ADK: a B2B order from an e-mail, over AG-UI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "adk-streaming",
    "ag-ui-adk==0.11.0",
    "fastapi",
    "google-adk>=2.13,<2.14",
    # For Ollama through LiteLlm. From 1.106, every call with tools fails without `mcp` installed.
    "litellm>=1.105,<1.106",
    "order-desk",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
order-agent = "order_agent.server:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.1",
]

[tool.uv.sources]
adk-streaming = { path = "../adk-streaming", editable = true }
order-desk = { path = "../order-desk", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "order_agent"

[tool.pytest.ini_options]
testpaths = ["tests", "../adk-streaming/tests", "../order-desk/tests"]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore::DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
