[project]
name = "order-agent-pydantic-ai"
version = "0.1.0"
description = "The order desk agent on Pydantic AI: a B2B order from an e-mail, over AG-UI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "order-desk",
    "pydantic-ai-slim[ag-ui,google,openai]>=2.61,<3",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
order-agent = "order_agent.server:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.1",
]

[tool.uv.sources]
order-desk = { path = "../order-desk", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "order_agent"

[tool.pytest.ini_options]
testpaths = ["../order-desk/tests"]
filterwarnings = ["ignore::DeprecationWarning:google.genai.types"]

[tool.ruff]
line-length = 100
