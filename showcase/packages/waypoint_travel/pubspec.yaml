name: waypoint_travel
description: "Waypoint's travel domain, with in-memory stand-ins for its travel provider."
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.13.0
dependencies:
  copy_with_extension: ^18.0.0
  equatable: ^3.0.0
dev_dependencies:
  build_runner: ^2.16.0
  copy_with_extension_gen: ^18.0.0
  # flutter_test, not test: the workspace's Flutter SDK pins a test_api that
  # test's current versions rule out.
  flutter_test:
    sdk: flutter
