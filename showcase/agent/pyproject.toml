[project]
name = "waypoint-agent"
version = "0.1.0"
description = "The agent of Waypoint, Tandem's showcase: it changes a business trip on the screen together with the traveller, over AG-UI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "adk-streaming",
    "ag-ui-adk==0.11.0",
    "fastapi",
    "google-adk>=2.13,<2.14",
    "pydantic-settings",
    "python-dotenv",
    "uvicorn",
]

[project.scripts]
waypoint-agent = "waypoint_agent.server:main"

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.17.1",
]

[tool.uv.sources]
adk-streaming = { path = "../../example/agents/adk-streaming", editable = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:\\[EXPERIMENTAL\\]:UserWarning",
    "ignore::DeprecationWarning:google.genai.types",
]

[tool.ruff]
line-length = 100
